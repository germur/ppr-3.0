# ----- 3. SPLAT POR PILLAR (hijos muertos subtema×ciudad → 301 al pillar) -----
# SIN force: si la página real existe, Netlify la sirve; si está muerta, 301.
# Cubre las ~582 URLs de subtema×ciudad que los 301 exactos no alcanzaban.
[[redirects]]
  from = "/restoration/water-damage/*"
  to = "/restoration/water-damage/"
  status = 301
[[redirects]]
  from = "/restoration/fire-damage/*"
  to = "/restoration/fire-damage/"
  status = 301
[[redirects]]
  from = "/restoration/mold-remediation/*"
  to = "/restoration/mold-remediation/"
  status = 301
[[redirects]]
  from = "/restoration/storm-damage/*"
  to = "/restoration/storm-damage/"
  status = 301

# ----- 4. PODA 410 GONE -----
# Resto de /restoration/ muerto (mitigation-services, flats viejos como
# storm-debris-removal, wind-damage, mold-testing) → 410. SIN force: protege
# los pillars y la home de restoration que sí existen.
[[redirects]]
  from = "/restoration/*"
  to = "/410.html"
  status = 410

# Matriz /services/ completa (la matriz remodeling vieja: 222 URLs) → 410
[[redirects]]
  from = "/services/*"
  to = "/410.html"
  status = 410
  force = true

# Matriz /service-areas/ (subpáginas ciudad×servicio, regiones, zombies) → 410
# SIN force: las 11 ciudades vivas (index) se sirven; sus hijos caen al 410.
[[redirects]]
  from = "/service-areas/*"
  to = "/410.html"
  status = 410

# Remodeling completo (sin licencia GC, fuera de alcance) → 410
[[redirects]]
  from = "/remodeling/*"
  to = "/410.html"
  status = 410
  force = true

# Cleaning services completo (no se presta) → 410
[[redirects]]
  from = "/cleaning-services/*"
  to = "/410.html"
  status = 410
  force = true

# Landing huérfana de Google Ads → 410
[[redirects]]
  from = "/landing/*"
  to = "/410.html"
  status = 410
  force = true

# ----- 5. BLOG VIEJO → /resources/ (301) -----
# El blog viejo murió sin redirect (incluía un post en posición 14 con clics).
[[redirects]]
  from = "/blog/*"
  to = "/resources/"
  status = 301

# ----- 6. FALLBACK 404 (debe ir AL FINAL) -----
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
