# ============================================================
# Paramount Property Restoration — netlify.toml
# Replanteamiento SEO v2: poda de la matriz programática.
# Netlify evalúa redirects EN ORDEN y para en la 1a coincidencia.
# Orden: (1) ciudades conservadas, (2) 301 exactos, (3) 301 splat por pillar,
#        (4) 410 matriz/familias, (5) trailing slash, (6) fallback 404.
# Los splats finales SIN force: Netlify sirve el archivo real si existe,
# y el redirect solo captura las URLs muertas.
# ============================================================

[build]
  command = "npm run build"
  publish = "dist"

[context.production]
  environment = { NODE_VERSION = "20" }

# ----- 1. CIUDADES REALES QUE SE CONSERVAN -----
# (Con los splats sin force de abajo, estas 11 reglas son redundantes pero
#  inofensivas: documentan las ciudades vivas y las protegen explícitamente.)
[[redirects]]
  from = "/service-areas/boca-raton/"
  to = "/service-areas/boca-raton/index.html"
  status = 200
