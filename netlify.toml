  to = "/service-areas/coral-gables/index.html"
  status = 200
[[redirects]]
  from = "/service-areas/delray-beach/"
  to = "/service-areas/delray-beach/index.html"
  status = 200
[[redirects]]
  from = "/service-areas/estero/"
  to = "/service-areas/estero/index.html"
  status = 200
[[redirects]]
  from = "/service-areas/fort-lauderdale/"
  to = "/service-areas/fort-lauderdale/index.html"
  status = 200
[[redirects]]
  from = "/service-areas/fort-myers/"
