# ----- 3. PODA 410 GONE (matriz programática + servicios fuera de alcance) -----
[[redirects]]
  from = "/service-areas/*/water-damage-restoration"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/service-areas/*/mold-remediation"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/service-areas/*/fire-damage-restoration"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/service-areas/*/storm-damage-repair"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/service-areas/*/kitchen-remodeling"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/service-areas/*/bathroom-remodeling"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/service-areas/*/commercial-renovation"
  to = "/410.html"
  status = 410
  force = true

# Resto de la matriz service-areas (regiones, [city]/[service], zombies)
[[redirects]]
  from = "/service-areas/*/*"
  to = "/410.html"
  status = 410
  force = true

# Remodeling completo (sin licencia GC — fuera de alcance)
[[redirects]]
  from = "/remodeling/*"
  to = "/410.html"
  status = 410
  force = true

# Cleaning services completo (no se presta)
[[redirects]]
  from = "/cleaning-services/*"
  to = "/410.html"
  status = 410
  force = true

# Landing huérfana de Google Ads
[[redirects]]
  from = "/landing/*"
  to = "/410.html"
  status = 410
  force = true

# ----- 4. TRAILING SLASH (de remoto): /path -> /path/ canónico -----
# Evita duplicados de canonical en GSC. Va DESPUÉS de los 410/301 para no interferir.
[[redirects]]
  from = "/:path"
  to = "/:path/"
  status = 301
  conditions = {path = ["*[^/]"]}
  force = false

# ----- 5. FALLBACK 404 (debe ir AL FINAL) -----
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
